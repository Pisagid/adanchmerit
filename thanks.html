<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Thank You · Adanch Merit Consulting</title>
<link rel="icon" href="media/icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#F6F7FB;--card:#FFFFFF;--fg:#0F1B2D;--muted:#5B6474;--line:#E4E8F0;--gold:#E3B45C;--hl:#C8902E;--pill:#0B0F17;--pill-fg:#fff;
  --head:"Montserrat","Segoe UI",system-ui,sans-serif;--body:"Inter","Segoe UI",system-ui,sans-serif}
:root[data-theme="dark"]{--bg:#0A101B;--card:#131D2E;--fg:#EEF1F6;--muted:#A3AEBF;--line:#22304A;--hl:#E8B65A;--pill:#F2F5F3;--pill-fg:#0B0F17;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 var(--body);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--gold);border-radius:18px;max-width:520px;width:100%;padding:34px 30px;text-align:center;box-shadow:0 20px 50px rgba(10,27,51,.1)}
img{width:72px;height:72px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--gold)}
h1{font:800 1.9rem/1.2 var(--head);margin:18px 0 0}
p{color:var(--muted);margin:12px 0 0}
.wa{font:700 18px var(--body);color:var(--fg);margin-top:6px}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px}
a.btn{display:inline-flex;padding:13px 22px;border-radius:999px;text-decoration:none;font:600 15px var(--body)}
.dark{background:var(--pill);color:var(--pill-fg)}
.line{border:1.5px solid var(--fg);color:var(--fg)}
</style>
<script>(function(){try{if(localStorage.getItem('am_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})();</script>
</head>
<body>
<main class="card">
  <img src="media/icon.png" alt="Adanch Merit logo">
  <h1>Thank you. We've got your details.</h1>
  <p>We'll review your profile and reply within two working days with an honest first read on whether EB-2 NIW or EB-1A fits you better.</p>
  <p>Want a faster answer? Message us on WhatsApp:</p>
  <p class="wa">+234 707 040 0146</p>
  <div class="acts">
    <a class="btn dark" href="https://wa.me/2347070400146?text=Hello%20Adanch%20Merit%2C%20I%20just%20sent%20my%20details%20through%20your%20website." target="_blank" rel="noopener">Open WhatsApp</a>
    <a class="btn line" href="index.html">Back to the site</a>
  </div>
</main>
</body>
</html>
